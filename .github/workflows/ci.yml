name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        suite: [component, workbench]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out elements
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: elements

      - name: Check out TypeScript SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/openbindings-ts
          ref: 173a5b4a63a4574b9576338add880b215749a66f
          path: openbindings-ts

      - name: Check out standalone artifact clients
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/openapi-client
          ref: 7b15d57e960faa6a9e010eb9cbea80fd83f0d02e
          path: openapi-client

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/asyncapi-client
          ref: 7326ce4e18c12e1dcb36c3587fbe0f7fe52ec749
          path: asyncapi-client

      - name: Check out shared interfaces
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/interfaces
          ref: c3d85bd8a534d344b0309f2b9ab27deed92399d6
          path: interfaces

      - name: Check out ob
        if: matrix.suite == 'workbench'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/ob
          ref: 6c8aeb02b893b01a4d5ab581af5c819cf5ead107
          path: ob

      - name: Check out Go SDK
        if: matrix.suite == 'workbench'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: openbindings/openbindings-go
          ref: d76792a0d11566777f675e7e7f22235e03f311f1
          path: openbindings-go

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            elements/pnpm-lock.yaml
            openbindings-ts/pnpm-lock.yaml

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        if: matrix.suite == 'workbench'
        with:
          go-version-file: ob/go.mod
          cache-dependency-path: ob/go.sum

      - name: Build neutral JSON prerequisites
        run: |
          pnpm --dir openbindings-ts install --frozen-lockfile --ignore-scripts
          pnpm --dir openbindings-ts --filter @openbindings/json --filter @openbindings/json-schema build

      - name: Build standalone artifact clients
        run: |
          pnpm --dir openapi-client install --frozen-lockfile
          pnpm --dir openapi-client build
          pnpm --dir asyncapi-client install --frozen-lockfile
          pnpm --dir asyncapi-client build

      - name: Resolve untagged Go SDK modules from the sibling checkout
        if: matrix.suite == 'workbench'
        working-directory: ob
        run: |
          go work init .
          awk '$1 ~ /^github.com\/openbindings\/openbindings-go/ {print $1}' go.mod | sort -u | while read -r mod; do
            rel="../openbindings-go${mod#github.com/openbindings/openbindings-go}"
            go work edit -replace "$mod=$rel"
          done
          go work edit -replace "github.com/openbindings/openapi-client/go=../openapi-client/go"
          go work edit -replace "github.com/openbindings/asyncapi-client/go=../asyncapi-client/go"

      - name: Build SDK dependencies
        working-directory: openbindings-ts
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @openbindings/sdk... build

      - name: Install element dependencies
        working-directory: elements
        run: pnpm install --frozen-lockfile

      - name: Build workbench packages
        if: matrix.suite == 'workbench'
        working-directory: elements
        run: pnpm build

      - name: Verify generated contracts
        if: matrix.suite == 'component'
        working-directory: elements
        run: |
          pnpm sync:requirements
          git diff --exit-code

      - name: Build, typecheck, and test packages
        if: matrix.suite == 'component'
        working-directory: elements
        run: |
          pnpm check
          pnpm test
          pnpm browser:imports
          pnpm ssr:imports
          pnpm pack:verify

      - name: Install Chromium
        working-directory: elements
        run: pnpm exec playwright install --with-deps chromium

      - name: Test plain-browser composition
        if: matrix.suite == 'component'
        working-directory: elements
        run: pnpm test:browser

      - name: Test embedded ob start workbench
        if: matrix.suite == 'workbench'
        working-directory: elements
        run: pnpm test:ob-start

  ci:
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          if not results or any(result != 'success' for result in results):
              raise SystemExit('Required job results: ' + repr(results))
          PY
